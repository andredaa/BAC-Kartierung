<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Tennis Tables Hamburg</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #map canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Style switcher */
    .style-switcher {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.5rem;
      display: flex;
      gap: 0.5rem;
      z-index: 50;
    }

    .style-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      background: #f3f4f6;
      color: #374151;
    }

    .style-btn.active {
      background: #3b82f6;
      color: white;
    }

    .style-btn:hover:not(.active) {
      background: #e5e7eb;
    }

    /* Burger menu button */
    .menu-toggle {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      border: none;
      cursor: pointer;
      z-index: 50;
    }

    .menu-toggle svg {
      height: 1.5rem;
      width: 1.5rem;
      color: #374151;
    }

    /* Download button */
    .download-btn {
      position: absolute;
      top: 4.5rem;
      left: 1rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 0.75rem;
      border: none;
      cursor: pointer;
      z-index: 50;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: #f3f4f6;
    }

    .download-btn svg {
      height: 1.5rem;
      width: 1.5rem;
      color: #374151;
    }

    /* Menu panel */
    .menu-panel {
      position: absolute;
      top: 1rem;
      left: 5rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      width: min(20rem, calc(100vw - 8rem));
      max-width: 20rem;
      z-index: 50;
      display: none;
    }

    .menu-panel.open {
      display: block;
    }

    .menu-panel h2 {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      outline: none;
      font-size: 1rem;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .load-btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .load-btn:hover:not(:disabled) {
      background: #2563eb;
    }

    .load-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* Survey Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: white;
      border: 2px solid #9ca3af;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border-radius: 0.5rem;
      width: 90vw;
      height: 90vh;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #d1d5db;
      background: #f3f4f6;
      border-radius: 0.5rem 0.5rem 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-header h6 {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #4b5563;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #1f2937;
    }

    .modal-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 0 0 0.5rem 0.5rem;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .modal-footer button {
      padding: 0.5rem 1.5rem;
      background: #3b82f6;
      color: white;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .modal-footer button:hover {
      background: #2563eb;
    }

    /* Confirmation Dialog */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .dialog-overlay.show {
      display: flex;
      opacity: 1;
    }

    .dialog-content {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      max-width: 400px;
      width: 90vw;
    }

    .dialog-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .dialog-message {
      margin-bottom: 1.5rem;
      color: #4b5563;
    }

    .dialog-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .dialog-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .dialog-btn.primary {
      background: #3b82f6;
      color: white;
    }

    .dialog-btn.primary:hover {
      background: #2563eb;
    }

    .dialog-btn.secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .dialog-btn.secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Style switcher -->
  <div class="style-switcher">
    <button class="style-btn active" data-style="light">Light</button>
    <button class="style-btn" data-style="dark">Dark</button>
    <button class="style-btn" data-style="satellite">Satellite</button>
  </div>

  <!-- Burger menu button -->
  <button class="menu-toggle" id="menuToggle">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Menu panel -->
  <div class="menu-panel" id="menuPanel">
    <h2>Table Tennis Tables</h2>
    
    <div class="form-group">
      <label for="surveyUrlInput">Survey URL</label>
      <input type="url" id="surveyUrlInput" placeholder="Enter survey URL" value="https://app.formbricks.com/s/cmrt2e6k7maj401ue7awxcw63?embed=true">
    </div>
    
    <button class="load-btn" id="loadTablesBtn">Load All Tables</button>
  </div>

  <!-- Confirmation Dialog -->
  <div class="dialog-overlay" id="confirmDialog">
    <div class="dialog-content" onclick="event.stopPropagation()">
      <div class="dialog-title">Start Survey</div>
      <div class="dialog-message" id="dialogMessage">Do you want to fill out the survey for this segment?</div>
      <div class="dialog-buttons">
        <button class="dialog-btn secondary" id="dialogCancel">Cancel</button>
        <button class="dialog-btn secondary" id="dialogRemove" style="display: none; background: #ef4444; color: white;">Remove from Completed</button>
        <button class="dialog-btn primary" id="dialogSurvey">Survey</button>
      </div>
    </div>
  </div>

  <!-- Survey Modal -->
  <div class="modal-overlay" id="surveyModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h6 id="modalTitle">Survey</h6>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="surveyIframe" frameborder="0"></iframe>
      </div>
      <div class="modal-footer">
        <button id="closeModalFooter">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { geojson } from './table_tennis_tables_hamburg.js';
    
    const mapStyles = {
      light: "https://tiles.basemaps.cartocdn.com/gl/positron-gl-style/style.json",
      dark: "https://tiles.basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
      satellite: {
        version: 8,
        sources: {
          satellite: {
            type: "raster",
            tiles: [
              "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
            ],
            tileSize: 256,
            attribution: "© Esri"
          }
        },
        layers: [
          {
            id: "satellite",
            type: "raster",
            source: "satellite",
            minzoom: 0,
            maxzoom: 22
          }
        ]
      }
    };

    // State
    let map = null;
    let currentStyle = "light";
    let isLoading = false;
    let selectedFeature = null;
    let selectedLocationId = null;

    // DOM elements
    const menuToggle = document.getElementById("menuToggle");
    const menuPanel = document.getElementById("menuPanel");
    const surveyUrlInput = document.getElementById("surveyUrlInput");
    const loadTablesBtn = document.getElementById("loadTablesBtn");
    const surveyModal = document.getElementById("surveyModal");
    const surveyIframe = document.getElementById("surveyIframe");
    const modalTitle = document.getElementById("modalTitle");
    const closeModal = document.getElementById("closeModal");
    const closeModalFooter = document.getElementById("closeModalFooter");
    const confirmDialog = document.getElementById("confirmDialog");
    const dialogMessage = document.getElementById("dialogMessage");
    const dialogCancel = document.getElementById("dialogCancel");
    const dialogSurvey = document.getElementById("dialogSurvey");
    const dialogRemove = document.getElementById("dialogRemove");
    const styleBtns = document.querySelectorAll(".style-btn");

    // Initialize map
    function initMap() {
      map = new maplibregl.Map({
        container: "map",
        style: mapStyles[currentStyle],
        center: [10.0, 53.5],
        zoom: 10,
        renderWorldCopies: false,
        attributionControl: true
      });

      // Error handling
      map.on('error', (e) => {
        console.error('Map error:', e);
      });

      // Add controls
      map.addControl(new maplibregl.ScaleControl(), "bottom-right");
      map.addControl(new maplibregl.NavigationControl(), "bottom-right");
      
      // Add GeolocateControl for live GPS tracking
      const geolocateControl = new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },
        trackUserLocation: true,
        showAccuracyCircle: true
      });
      map.addControl(geolocateControl, "bottom-right");
      
      // Force resize on load to ensure proper rendering in Chrome
      map.on('load', () => {
        setTimeout(() => {
          map.resize();
          loadTableTennisData();
        }, 100);
      });
    }

    // Switch map style
    function switchMapStyle(style) {
      if (!map) return;
      
      currentStyle = style;
      
      // Update button states
      styleBtns.forEach(btn => {
        if (btn.dataset.style === style) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
      
      map.setStyle(mapStyles[style]);
      
      // Wait for style to load before adding routes
      setTimeout(() => {
        loadTableTennisData();
      }, 500);
    }

    // Load all table tennis features
    async function loadTableTennisData() {
      if (!map) return;
      
      isLoading = true;
      loadTablesBtn.disabled = true;
      loadTablesBtn.textContent = "Loading...";
      
      try {
        // Remove existing layers if present
        const layersToRemove = ["table-tennis-label", "table-tennis"];
        layersToRemove.forEach(layerId => {
          if (map.getLayer(layerId)) {
            map.removeLayer(layerId);
          }
        });
        if (map.getSource("table-tennis-source")) {
          map.removeSource("table-tennis-source");
        }
        
        // Add source with imported geojson data
        map.addSource("table-tennis-source", {
          type: "geojson",
          data: geojson,
        });
        
        // Add circle layer for table tennis locations
        map.addLayer({
          id: "table-tennis",
          type: "circle",
          source: "table-tennis-source",
          paint: {
            "circle-radius": 8,
            "circle-color": "#3b82f6",
            "circle-stroke-width": 2,
            "circle-stroke-color": "#fff"
          }
        });

        // Add label layer with location names
        map.addLayer({
          id: "table-tennis-label",
          type: "symbol",
          source: "table-tennis-source",
          layout: {
            "text-field": ["get", "name"],
            "text-size": 12,
            "text-offset": [0, -2],
            "text-allow-overlap": false
          },
          paint: {
            "text-color": "#000000",
            "text-halo-color": "#ffffff",
            "text-halo-width": 2,
          },
        });

        // Add click handler for features
        map.on("click", "table-tennis", handleFeatureClick);
        map.on("mouseenter", "table-tennis", () => {
          map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", "table-tennis", () => {
          map.getCanvas().style.cursor = "";
        });
        
        console.log(`Loaded ${geojson.features.length} table tennis locations`);
        
      } catch (error) {
        console.error("Error loading table tennis data:", error);
      } finally {
        isLoading = false;
        loadTablesBtn.disabled = false;
        loadTablesBtn.textContent = "Load All Tables";
      }
    }


    // Handle feature click
    function handleFeatureClick(e) {
      if (e.features && e.features.length > 0) {
        selectedFeature = e.features[0];
        selectedLocationId = selectedFeature.properties["@id"];
        console.log("feature id", selectedLocationId);
        
        dialogMessage.textContent = `Open survey for ${selectedLocationId}?`;
        dialogRemove.style.display = "none";
        confirmDialog.classList.add("show");
      }
    }

    // Open survey modal
    function openSurveyModal() {
      const surveyUrl = surveyUrlInput.value.trim();
      if (surveyUrl) {
        const url = new URL(surveyUrl);
        url.searchParams.set("location_id", selectedLocationId);
        surveyIframe.src = url.toString();
      }
      const locationName = selectedLocationId;
      modalTitle.textContent = `Survey - ${locationName}`;
      surveyModal.classList.add("show");
      confirmDialog.classList.remove("show");
    }

    // Close survey modal
    function closeSurveyModal() {
      surveyModal.classList.remove("show");
      surveyIframe.src = "";
      selectedFeature = null;
      selectedLocationId = null;
    }

    // Close confirmation dialog
    function closeDialog() {
      confirmDialog.classList.remove("show");
      selectedFeature = null;
      selectedLocationId = null;
    }

    // Event listeners
    menuToggle.addEventListener("click", () => {
      menuPanel.classList.toggle("open");
    });

    loadTablesBtn.addEventListener("click", () => {
      loadTableTennisData();
      menuPanel.classList.remove("open");
    });

    styleBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        switchMapStyle(btn.dataset.style);
      });
    });

    dialogCancel.addEventListener("click", closeDialog);
    dialogSurvey.addEventListener("click", () => {
      openSurveyModal();
    });
    confirmDialog.addEventListener("click", (e) => {
      if (e.target === confirmDialog) {
        closeDialog();
      }
    });

    closeModal.addEventListener("click", closeSurveyModal);
    closeModalFooter.addEventListener("click", closeSurveyModal);
    surveyModal.addEventListener("click", (e) => {
      if (e.target === surveyModal) {
        closeSurveyModal();
      }
    });

    // Initialize
    initMap();
  </script>
</body>
</html>
